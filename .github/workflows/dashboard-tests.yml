name: Dashboard tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/coffee-shop-control-center]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node --check features-logging.js
      - run: node --check api/logs.js
      - run: npm test
