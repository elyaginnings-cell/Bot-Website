<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading dashboard…</title>
<link rel="icon" href="/amazon-favicon.svg?v=2" type="image/svg+xml">
</head>
<body>
<script>
(async function () {
  try {
    var shellUrl =
      "https://raw.githubusercontent.com/elyaginnings-cell/Bot-Website/147232bd5d52eb2ba98a5e5277445508e2c8e705/index.html";
    var res = await fetch(shellUrl + "?t=" + Date.now());
    if (!res.ok) throw new Error("Shell HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("server-view") === -1) {
      throw new Error("Bad shell content");
    }
    document.open();
    document.write(html);
    document.close();

    function loadScript(src) {
      return new Promise(function (resolve) {
        var s = document.createElement("script");
        s.src = src;
        s.async = false;
        s.onload = function () { resolve(true); };
        s.onerror = function () {
          console.error("Failed:", src);
          resolve(false);
        };
        document.body.appendChild(s);
      });
    }

    // Core feature patches (existing)
    await loadScript("/features-ui.js?v=7");
    await loadScript("/features-config.js?v=18");
    await loadScript("/features-ui-patch.js?v=12");
    await loadScript("/features-config-patch.js?v=28");
    await loadScript("/app-config-fix.js?v=1");
    await loadScript("/sr-panels.js?v=2");
    await loadScript("/sv-members-load.js?v=5");

    // Lightweight server-view extras (stable)
    await loadScript("/sv-stable.js?v=1");
  } catch (e) {
    document.body.innerHTML =
      '<div style="font-family:system-ui;padding:2rem">' +
      "<h1>Dashboard failed to load</h1><p>" +
      (e && e.message ? e.message : e) +
      "</p></div>";
  }
})();
</script>
</body>
</html>
