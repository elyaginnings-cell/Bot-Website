<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading dashboard…</title>
<link rel="icon" href="/amazon-favicon.svg?v=2" type="image/svg+xml">
</head>
<body>
<script>
(async function () {
  try {
    var url = "https://raw.githubusercontent.com/elyaginnings-cell/Bot-Website/147232bd5d52eb2ba98a5e5277445508e2c8e705/index.html";
    var res = await fetch(url + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("server-view") === -1) {
      throw new Error("Unexpected content length " + html.length);
    }
    html = html
      .replace(/server-view\.js\?v=\d+/g, "server-view.js?v=22")
      .replace(/sv-members-load\.js\?v=\d+/g, "sv-members-load.js?v=22")
      .replace(/server-view\.css(?![?\w])/g, "server-view.css?v=4")
      .replace(/server-view-reply\.css(?![?\w])/g, "server-view-reply.css?v=4")
      .replace(/sv-rich\.css(?![?\w])/g, "sv-rich.css?v=4")
      .replace(/server-view-members\.css\?v=\d+/g, "server-view-members.css?v=12");
    document.open();
    document.write(html);
    document.close();
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }
    await loadScript("/features-ui.js?v=9");
    await loadScript("/features-config.js?v=18");
    await loadScript("/features-ui-patch.js?v=12");
    await loadScript("/features-config-patch.js?v=29");
    await loadScript("/features-automod-staff.js?v=4");
    await loadScript("/app-config-fix.js?v=1");
    await loadScript("/sr-panels.js?v=2");
    await loadScript("/sv-members-load.js?v=22");
    await loadScript("/sv-manage.js?v=3");
    await loadScript("/sv-stable.js?v=7");
    await loadScript("/sv-role-colors.js?v=2");
    await loadScript("/sv-core-fix.js?v=3");
    await loadScript("/sv-slash.js?v=1");
    await loadScript("/sv-discord-exact.js?v=5");
    await loadScript("/sv-emoji-picker.js?v=1");
    await loadScript("/sv-unread.js?v=1");
    await loadScript("/sv-members-force.js?v=2");
    await loadScript("/sv-media-react.js?v=1");
  } catch (e) {
    document.body.innerHTML =
      "<div style=\"font-family:system-ui;padding:2rem;max-width:32rem\">" +
      "<h1>Could not load dashboard</h1>" +
      "<p>" + (e && e.message ? e.message : e) + "</p></div>";
  }
})();
</script>
</body>
</html>
