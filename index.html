<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading dashboard…</title>
<link rel="icon" href="/amazon-favicon.svg?v=2" type="image/svg+xml">
</head>
<body>
<script>
(async function () {
  try {
    var url = "https://raw.githubusercontent.com/elyaginnings-cell/Bot-Website/main/dashboard.html";
    var res = await fetch(url + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("server-view") === -1) {
      throw new Error("Unexpected content length " + html.length);
    }
    var INVITE_CARD =
      '<div class="card form-card wide" id="invite-bot-card" data-invite-bot="1" style="margin-top:16px">' +
      '<span class="eyebrow">INVITE BOT</span>' +
      '<h2>Add bot to a server</h2>' +
      '<p class="form-hint">Pick a server you manage, or use the generic invite and choose the server on Discord.</p>' +
      '<div id="invite-bot-status" class="form-hint" style="margin-bottom:10px"></div>' +
      '<div id="invite-bot-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto"></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">' +
      '<button type="button" class="button" id="invite-bot-refresh">Refresh servers</button>' +
      '<button type="button" class="button secondary" id="invite-bot-generic">Open generic invite</button>' +
      '<a class="button secondary" id="invite-bot-relogin" href="/api/login" style="display:none;text-decoration:none;align-items:center">Log in with Discord</a>' +
      '</div></div>';

    var LOGS_SECTION =
      '<section id="logs" class="page-section">' +
      '<div class="card form-card wide" id="central-logging-root" data-central-logs="1">' +
      '<span class="eyebrow">LOGS</span><h2>Central logging</h2>' +
      '<p class="form-hint">Loading log settings…</p>' +
      '<div id="log-boot-placeholder"></div></div></section>';

    html = html.replace(
      /<section[^>]*id="logs"[^>]*>[\s\S]*?<\/section>/i,
      LOGS_SECTION
    );

    html = html
      .replace(/server-view\.js\?v=\d+/g, "server-view.js?v=43")
      .replace(/sr-panels\.js\?v=\d+/g, "sr-panels.js?v=4")
      .replace(/features-selfroles-v3\.js\?v=\d+/g, "features-selfroles-v3.js?v=4")
      .replace(/sv-members-load\.js\?v=\d+/g, "sv-members-load.js?v=37")
      .replace(/server-view\.css(?![?\w])/g, "server-view.css?v=6")
      .replace(/server-view-reply\.css(?![?\w])/g, "server-view-reply.css?v=5")
      .replace(/sv-rich\.css(?![?\w])/g, "sv-rich.css?v=5")
      .replace(/server-view-members\.css\?v=\d+/g, "server-view-members.css?v=14")
      .replace(/sv-readability\.css(?![?\w])/g, "sv-readability.css?v=2")
;

    if (html.indexOf("invite-bot-card") === -1) {
      html = html.replace(
        /(<section[^>]*id="settings"[^>]*>[\s\S]*?id="presence-status"[\s\S]*?<\/p>\s*<\/div>)\s*<\/section>/,
        "$1\n" + INVITE_CARD + "\n</section>"
      );
    }
    if (html.indexOf("invite-bot-card") === -1) {
      var sIdx = html.indexOf('id="settings"');
      if (sIdx >= 0) {
        var closeIdx = html.indexOf("</section>", sIdx);
        if (closeIdx >= 0) {
          html = html.slice(0, closeIdx) + INVITE_CARD + html.slice(closeIdx);
        }
      }
    }

    document.open();
    document.write(html);
    document.close();
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = function () {
          console.error("Script failed:", src);
          resolve();
        };
        document.body.appendChild(s);
      });
    }
    function loadCss(href) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = href;
      document.head.appendChild(l);
    }
    loadCss("/mobile-fix.css?v=5");
    loadCss("/mobile-overhaul.css?v=1");
    loadCss("/server-view-overhaul.css?v=1");
    await loadScript("/features-ui.js?v=10");
    await loadScript("/features-config.js?v=18");
    await loadScript("/features-ui-patch.js?v=13");
    await loadScript("/features-custom-emojis.js?v=5");
    await loadScript("/features-config-patch.js?v=31");
    await loadScript("/features-automod-staff.js?v=4");
    await loadScript("/features-security-upgrade.js?v=2");
    await loadScript("/features-sudo-operator.js?v=1");
    await loadScript("/features-ai-chat.js?v=1");
    await loadScript("/features-ai-ignore-roles.js?v=1");
    await loadScript("/features-systems.js?v=1");
    await loadScript("/features-tab-toggles.js?v=3");
    await loadScript("/features-audit-logs.js?v=4");
    await loadScript("/features-logging.js?v=4");
    await loadScript("/features-loa.js?v=3");
    await loadScript("/features-activitycheck.js?v=3");
    await loadScript("/features-tickets.js?v=13");
    await loadScript("/features-tickets-bridge.js?v=3");
    await loadScript("/app-config-fix.js?v=6");
    await loadScript("/app-selects-fix.js?v=3");
    await loadScript("/sr-panels.js?v=2");
    await loadScript("/features-selfroles-v3.js?v=3");
    await loadScript("/features-invite-bot.js?v=3");
    await loadScript("/sv-members-load.js?v=37");
    await loadScript("/sv-manage.js?v=4");
    await loadScript("/sv-stable.js?v=7");
    await loadScript("/sv-role-colors.js?v=2");
    await loadScript("/sv-core-fix.js?v=5");
    await loadScript("/sv-slash.js?v=4");
    await loadScript("/sv-discord-exact.js?v=6");
    await loadScript("/sv-media-proxy.js?v=3");
    await loadScript("/sv-emoji-picker.js?v=9");
    await loadScript("/sv-emoji-force.js?v=5");
    await loadScript("/sv-mobile-fix.js?v=1");
    await loadScript("/sv-unread.js?v=2");
    await loadScript("/sv-members-force.js?v=5");
    await loadScript("/sv-media-react.js?v=5");
    await loadScript("/sv-ux-polish.js?v=3");
    await loadScript("/sv-phase0.js?v=2");
    await loadScript("/login-auth.js?v=6");
    await loadScript("/click-rescue.js?v=1");
    await loadScript("/refined-dashboard.js?v=3");
    loadCss("/refined-dashboard.css?v=4");
    await loadScript("/theme-boot.js?v=18");
  } catch (e) {
    document.body.innerHTML =
      "<div style=\"font-family:system-ui;padding:2rem;max-width:32rem\">" +
      "<h1>Could not load dashboard</h1>" +
      "<p>" + (e && e.message ? e.message : e) + "</p></div>";
  }
})();
</script>
</body>
</html>
