<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading dashboard…</title>
<link rel="icon" href="/amazon-favicon.svg?v=2" type="image/svg+xml">
</head>
<body>
<script>
(async function () {
  try {
    var url = "https://raw.githubusercontent.com/elyaginnings-cell/Bot-Website/147232bd5d52eb2ba98a5e5277445508e2c8e705/index.html";
    var res = await fetch(url + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("server-view") === -1) {
      throw new Error("Unexpected content length " + html.length);
    }
    var SV_THEME_OPTIONS =
      '<option value="discord">Discord</option>' +
      '<option value="darker">Darker</option>' +
      '<option value="amoled">AMOLED</option>' +
      '<option value="ash">Ash</option>' +
      '<option value="blurple">Blurple</option>' +
      '<option value="light">Light</option>' +
      '<option value="midnight">Midnight</option>' +
      '<option value="nord">Nord</option>' +
      '<option value="dracula">Dracula</option>' +
      '<option value="catppuccin">Catppuccin</option>' +
      '<option value="tokyo">Tokyo Night</option>' +
      '<option value="gruvbox">Gruvbox</option>' +
      '<option value="forest">Forest</option>' +
      '<option value="ocean">Ocean</option>' +
      '<option value="crimson">Crimson</option>' +
      '<option value="cyber">Cyber</option>' +
      '<option value="vapor">Vapor</option>' +
      '<option value="soft">Soft</option>' +
      '<option value="mono">Mono</option>' +
      '<option value="terminal">Terminal</option>' +
      '<option value="garden">Garden</option>';
    html = html
      .replace(/server-view\.js\?v=\d+/g, "server-view.js?v=38")
      .replace(/sv-members-load\.js\?v=\d+/g, "sv-members-load.js?v=37")
      .replace(/server-view\.css(?![?\w])/g, "server-view.css?v=5")
      .replace(/server-view-reply\.css(?![?\w])/g, "server-view-reply.css?v=5")
      .replace(/sv-rich\.css(?![?\w])/g, "sv-rich.css?v=5")
      .replace(/server-view-members\.css\?v=\d+/g, "server-view-members.css?v=14")
      .replace(/server-view-theme-garden\.css(?![?\w])/g, "server-view-theme-garden.css?v=4")
      .replace(/sv-readability\.css(?![?\w])/g, "sv-readability.css?v=2")
      .replace(
        /<select id="sv-theme">[\s\S]*?<\/select>/,
        '<select id="sv-theme">' + SV_THEME_OPTIONS + '</select>'
      );
    document.open();
    document.write(html);
    document.close();
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }
    await loadScript("/features-ui.js?v=9");
    await loadScript("/features-config.js?v=18");
    await loadScript("/features-ui-patch.js?v=13");
    await loadScript("/features-config-patch.js?v=29");
    await loadScript("/features-automod-staff.js?v=4");
    await loadScript("/features-sudo-operator.js?v=1");
    await loadScript("/features-ai-chat.js?v=1");
    await loadScript("/features-loa.js?v=3");
    await loadScript("/features-activitycheck.js?v=3");
    await loadScript("/app-config-fix.js?v=3");
    await loadScript("/app-selects-fix.js?v=3");
    await loadScript("/sr-panels.js?v=2");
    await loadScript("/sv-members-load.js?v=37");
    await loadScript("/sv-manage.js?v=3");
    await loadScript("/sv-stable.js?v=7");
    await loadScript("/sv-role-colors.js?v=2");
    await loadScript("/sv-core-fix.js?v=3");
    await loadScript("/sv-slash.js?v=1");
    await loadScript("/sv-discord-exact.js?v=5");
    await loadScript("/sv-media-proxy.js?v=3");
    await loadScript("/sv-emoji-picker.js?v=8");
    await loadScript("/sv-emoji-force.js?v=4");
    await loadScript("/sv-mobile-fix.js?v=1");
    await loadScript("/sv-unread.js?v=1");
    await loadScript("/sv-members-force.js?v=4");
    await loadScript("/sv-media-react.js?v=5");
    await loadScript("/sv-ux-polish.js?v=3");
    await loadScript("/sv-phase0.js?v=2");
    await loadScript("/theme-boot.js?v=13");
    await loadScript("/nav-drawer.js?v=3");
    await loadScript("/sv-themes-expand.js?v=2");
  } catch (e) {
    document.body.innerHTML =
      "<div style=\"font-family:system-ui;padding:2rem;max-width:32rem\">" +
      "<h1>Could not load dashboard</h1>" +
      "<p>" + (e && e.message ? e.message : e) + "</p></div>";
  }
})();
</script>
</body>
</html>
