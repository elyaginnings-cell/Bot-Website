<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Loading dashboard…</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
</head><body style="background:#07030d;color:#fff;font-family:system-ui;padding:2rem">
<p>Loading full dashboard…</p>
<script>
(async () => {
  try {
    const [a,b] = await Promise.all([
      fetch('/index.part1.b64?v=3').then(r=>r.text()),
      fetch('/index.part2.b64?v=3').then(r=>r.text())
    ]);
    const b64 = (a+b).replace(/\s+/g,'');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.body.innerHTML = '<p>Load failed. Hard-refresh.</p><pre>'+e+'</pre>';
  }
})();
</script></body></html>
