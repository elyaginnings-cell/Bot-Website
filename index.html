<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <title>Coffee Shop — Bot Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="server-view.css">
    <link rel="stylesheet" href="server-view-components.css">
    <link rel="stylesheet" href="server-view-theme-garden.css">
    <link rel="stylesheet" href="login-extra.css">
</head>
<body class="mode-auto">
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-icon">☕</div>
            <h1>Coffee Shop</h1>
            <p>Bot Control Dashboard</p>
            <form id="password-login-form" class="login-form" autocomplete="on">
                <label class="login-field">
                    <span>Email</span>
                    <input id="login-email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com">
                </label>
                <label class="login-field">
                    <span>Password</span>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
                </label>
                <p class="login-error" id="login-error" hidden></p>
                <button class="button login-btn" id="password-login-button" type="submit">Log in</button>
                <button class="button secondary login-btn" id="password-signup-button" type="button">Create account</button>
            </form>
            <div class="login-divider"><span>or</span></div>
            <button class="button secondary login-btn" id="login-button" type="button">Login with Discord</button>
        </div>
    </div>

    <div id="app" hidden>
        <main class="main" style="padding:24px;max-width:900px;margin:0 auto;">
            <header class="header card">
                <div class="header-text">
                    <h1>Coffee Shop</h1>
                    <p>You are signed in.</p>
                </div>
                <div class="account">
                    <div class="account-avatar"><img id="user-avatar" src="" alt=""></div>
                    <div class="account-info">
                        <strong id="username">Loading...</strong>
                        <span>Account</span>
                    </div>
                    <button class="logout-btn" id="logout-button" type="button">Logout</button>
                </div>
            </header>
            <section class="card" style="margin-top:16px;">
                <p>Email/password and Discord now use the same account table. After you merge and we restore the full dashboard markup, all existing control panels come back.</p>
                <p id="welcome-name"></p>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="login-auth.js"></script>
</body>
</html>
