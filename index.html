<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Loading…</title>
<link rel="icon" href="/amazon-favicon.svg" type="image/svg+xml">
</head><body>
<script>
(async function(){
  var n = 21;
  var parts = [];
  for (var i=0;i<n;i++) {
    parts.push(fetch("/dc"+i+".txt?v=6").then(function(r){ return r.text(); }));
  }
  var texts = await Promise.all(parts);
  document.open();
  document.write(texts.join(""));
  document.close();
})();
</script>
</body></html>
