<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading dashboard…</title>
<link rel="icon" href="/amazon-favicon.svg?v=2" type="image/svg+xml">
</head>
<body>
<script>
(async function () {
  try {
    // Last known-good index.html commit
    var url = "https://raw.githubusercontent.com/elyaginnings-cell/Bot-Website/147232bd5d52eb2ba98a5e5277445508e2c8e705/index.html";
    var res = await fetch(url + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("server-view") === -1) {
      throw new Error("Unexpected content length " + html.length);
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML =
      "<div style=\"font-family:system-ui;padding:2rem;max-width:32rem\">" +
      "<h1>Could not load dashboard</h1>" +
      "<p>" + (e && e.message ? e.message : e) + "</p>" +
      "<p>Hard-refresh, or open the raw good commit and copy index.html onto main.</p>" +
      "</div>";
  }
})();
</script>
</body>
</html>
