<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Shop · Loading dashboard</title>
<link rel="icon" href="/amazon-favicon.svg?v=2" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  html,body{min-height:100%;margin:0;background:#090510!important;color:#fff7ff!important}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .boot-splash{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,rgba(183,65,210,.18),transparent 42%),#090510}
  .boot-card{display:flex;align-items:center;gap:14px;padding:18px 22px;border:1px solid rgba(221,112,255,.22);border-radius:18px;background:#130b1d;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .boot-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#e45af2,#8c38c5);font-size:22px}
  .boot-title{font-weight:750;letter-spacing:-.02em}.boot-subtitle{margin-top:4px;color:#c7b5d1;font-size:12px}
  .boot-pulse{width:7px;height:7px;margin-left:8px;border-radius:50%;background:#e879f9;box-shadow:0 0 0 5px rgba(232,121,249,.12);animation:bootpulse 1.3s ease-in-out infinite}
  @keyframes bootpulse{50%{opacity:.35;transform:scale(.8)}}
</style>
</head>
<body>
<div class="boot-splash" role="status" aria-live="polite"><div class="boot-card"><span class="boot-mark">☕</span><div><div class="boot-title">Coffee Shop</div><div class="boot-subtitle">Preparing your dashboard…</div></div><span class="boot-pulse"></span></div></div>
<script>
(async function () {
  try {
    var url = "https://raw.githubusercontent.com/elyaginnings-cell/Bot-Website/main/dashboard.html";
    var res = await fetch(url + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    var html = await res.text();
    if (html.length < 5000 || html.indexOf("server-view") === -1) {
      throw new Error("Unexpected content length " + html.length);
    }
    var INVITE_CARD =
      '<div class="card form-card wide" id="invite-bot-card" data-invite-bot="1" style="margin-top:16px">' +
      '<span class="eyebrow">INVITE BOT</span>' +
      '<h2>Add bot to a server</h2>' +
      '<p class="form-hint">Pick a server you manage, or use the generic invite and choose the server on Discord.</p>' +
      '<div id="invite-bot-status" class="form-hint" style="margin-bottom:10px"></div>' +
      '<div id="invite-bot-list" style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto"></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">' +
      '<button type="button" class="button" id="invite-bot-refresh">Refresh servers</button>' +
      '<button type="button" class="button secondary" id="invite-bot-generic">Open generic invite</button>' +
      '<a class="button secondary" id="invite-bot-relogin" href="/api/login" style="display:none;text-decoration:none;align-items:center">Log in with Discord</a>' +
      '</div></div>';

    var LOGS_SECTION =
      '<section id="logs" class="page-section">' +
      '<div class="card form-card wide" id="central-logging-root" data-central-logs="1">' +
      '<span class="eyebrow">LOGS</span><h2>Central logging</h2>' +
      '<p class="form-hint">Loading log settings…</p>' +
      '<div id="log-boot-placeholder"></div></div></section>';

    html = html.replace(
      /<section[^>]*id="logs"[^>]*>[\s\S]*?<\/section>/i,
      LOGS_SECTION
    );

    html = html
      .replace(/server-view\.js\?v=\d+/g, "server-view.js?v=43")
      .replace(/sr-panels\.js\?v=\d+/g, "sr-panels.js?v=4")
      .replace(/features-selfroles-v3\.js\?v=\d+/g, "features-selfroles-v3.js?v=4")
      .replace(/sv-members-load\.js\?v=\d+/g, "sv-members-load.js?v=37")
      .replace(/server-view\.css(?![?\w])/g, "server-view.css?v=6")
      .replace(/server-view-reply\.css(?![?\w])/g, "server-view-reply.css?v=5")
      .replace(/sv-rich\.css(?![?\w])/g, "sv-rich.css?v=5")
      .replace(/server-view-members\.css\?v=\d+/g, "server-view-members.css?v=14")
      .replace(/sv-readability\.css(?![?\w])/g, "sv-readability.css?v=2")
;

    if (html.indexOf("invite-bot-card") === -1) {
      html = html.replace(
        /(<section[^>]*id="settings"[^>]*>[\s\S]*?id="presence-status"[\s\S]*?<\/p>\s*<\/div>)\s*<\/section>/,
        "$1\n" + INVITE_CARD + "\n</section>"
      );
    }
    if (html.indexOf("invite-bot-card") === -1) {
      var sIdx = html.indexOf('id="settings"');
      if (sIdx >= 0) {
        var closeIdx = html.indexOf("</section>", sIdx);
        if (closeIdx >= 0) {
          html = html.slice(0, closeIdx) + INVITE_CARD + html.slice(closeIdx);
        }
      }
    }

    // Keep a branded gate above the dashboard until its CSS has finished
    // loading. The old HTML was visible before stylesheets applied, producing
    // a full-page white/default-browser flash on every navigation.
    html = html.replace("</head>",
      '<style id="dashboard-style-gate">html,body{min-height:100%;background:#090510!important}#dashboard-style-gate-overlay{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,rgba(183,65,210,.18),transparent 42%),#090510;color:#fff7ff;font:600 14px system-ui}#dashboard-style-gate-overlay .gate-card{padding:18px 22px;border:1px solid rgba(221,112,255,.22);border-radius:18px;background:#130b1d;box-shadow:0 18px 60px rgba(0,0,0,.35)}</style></head>'
    );
    html = html.replace(/<body([^>]*)>/i,
      '<body$1><div id="dashboard-style-gate-overlay" role="status"><div class="gate-card">☕ Coffee Shop · Preparing your dashboard…</div></div>'
    );

    document.open();
    document.write(html);
    document.close();
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.async = false;
        s.onload = resolve;
        s.onerror = function () { reject(new Error("Failed to load " + src)); };
        document.body.appendChild(s);
      });
    }
    function loadCss(href) {
      return new Promise(function (resolve, reject) {
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = href;
        l.onload = resolve;
        l.onerror = function () { reject(new Error("Failed to load stylesheet " + href)); };
        document.head.appendChild(l);
      });
    }
    // Re-add the core styles with origin-root URLs and wait for them before
    // booting the dashboard scripts. This prevents the unstyled HTML flash.
    await Promise.all([
      loadCss("/style.css?v=7"),
      loadCss("/refined-dashboard.css?v=7"),
      loadCss("/guest-auth.css?v=1"),
      loadCss("/mobile-fix.css?v=5"),
      loadCss("/mobile-overhaul.css?v=1"),
      loadCss("/server-view-overhaul.css?v=1")
    ]);
    var styleGate=document.getElementById("dashboard-style-gate-overlay");
    if(styleGate)styleGate.remove();
    var gateStyle=document.getElementById("dashboard-style-gate");
    if(gateStyle)gateStyle.remove();
    var scripts = [
      "/features-ui.js?v=10",
      "/refined-dashboard.js?v=4",
      "/features-config.js?v=18",
      "/features-ui-patch.js?v=13",
      "/features-custom-emojis.js?v=5",
      "/features-config-patch.js?v=31",
      "/features-automod-staff.js?v=4",
      "/features-security-upgrade.js?v=2",
      "/features-sudo-operator.js?v=1",
      "/features-ai-chat.js?v=1",
      "/features-ai-ignore-roles.js?v=1",
      "/features-systems.js?v=1",
      "/features-tab-toggles.js?v=3",
      "/features-audit-logs.js?v=4",
      "/features-logging.js?v=4",
      "/features-loa.js?v=3",
      "/features-activitycheck.js?v=3",
      "/features-tickets.js?v=13",
      "/features-tickets-bridge.js?v=3",
      "/app-config-fix.js?v=6",
      "/app-selects-fix.js?v=3",
      "/sr-panels.js?v=2",
      "/features-selfroles-v3.js?v=3",
      "/features-invite-bot.js?v=3",
      "/sv-members-load.js?v=37",
      "/sv-manage.js?v=4",
      "/sv-stable.js?v=7",
      "/sv-role-colors.js?v=2",
      "/sv-core-fix.js?v=5",
      "/sv-slash.js?v=4",
      "/sv-discord-exact.js?v=6",
      "/sv-media-proxy.js?v=3",
      "/sv-emoji-picker.js?v=9",
      "/sv-emoji-force.js?v=5",
      "/sv-mobile-fix.js?v=1",
      "/sv-unread.js?v=2",
      "/sv-members-force.js?v=5",
      "/sv-media-react.js?v=5",
      "/sv-ux-polish.js?v=3",
      "/sv-phase0.js?v=2",
      "/click-rescue.js?v=1",
      "/theme-boot.js?v=18"
    ];
    await Promise.all(scripts.map(loadScript));
  } catch (e) {
    document.body.innerHTML =
      "<div style=\"font-family:system-ui;padding:2rem;max-width:32rem\">" +
      "<h1>Could not load dashboard</h1>" +
      "<p>" + (e && e.message ? e.message : e) + "</p></div>";
  }
})();
</script>
</body>
</html>
